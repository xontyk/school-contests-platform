<!-- Supabase → Authentication → Emails → Magic link. Тема: Код подтверждения для портала достижений -->
<meta charset="utf-8">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0c;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#151517;border:1px solid #2a2a2e;border-radius:24px;">
      <tr><td style="padding:32px 32px 8px 32px;">
        <p style="margin:0 0 24px 0;color:#4be36b;font-size:13px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;">&#10022; Портал достижений лицея</p>
        <h1 style="margin:0 0 12px 0;color:#f2f2ee;font-size:26px;line-height:1.2;">Подтвердите почту</h1>
        <p style="margin:0 0 24px 0;color:#b9b9c0;font-size:15px;line-height:1.5;">Введите этот код на сайте, чтобы продолжить:</p>
      </td></tr>
      <tr><td align="center" style="padding:0 32px;">
        <div style="background:#0b0b0c;border:2px solid #4be36b;border-radius:18px;padding:18px 12px;color:#4be36b;font-family:'Courier New',Courier,monospace;font-size:38px;font-weight:bold;letter-spacing:10px;text-align:center;">{{ .Token }}</div>
      </td></tr>
      <tr><td style="padding:24px 32px 8px 32px;">
        <p style="margin:0 0 16px 0;color:#b9b9c0;font-size:15px;line-height:1.5;">Или просто нажмите кнопку на том устройстве, где открыт сайт:</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4be36b;color:#0b0b0c;font-size:15px;font-weight:bold;text-decoration:none;padding:14px 26px;border-radius:999px;">Подтвердить почту</a>
      </td></tr>
      <tr><td style="padding:24px 32px 32px 32px;">
        <p style="margin:0;color:#7c7c84;font-size:13px;line-height:1.5;">Код действует один час. Если вы ничего не запрашивали, просто удалите это письмо.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
